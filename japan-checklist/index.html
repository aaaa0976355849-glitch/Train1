<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b42318">
  <title>日本 700 景點踩點圖鑑</title>
  <link rel="stylesheet" href="style.css?v=20260912-3">
  <script src="photos.js?v=hokkaido-static-1" defer></script>
  <script src="app.js?v=20260912-3" defer></script>
</head>
<body>
<header class="hero"><p class="eyebrow">JAPAN TRAVEL COLLECTION</p><h1>日本景點踩點圖鑑</h1></header>
<main>
  <section class="region-progress card" aria-labelledby="progressTitle">
    <div class="section-title"><h2 id="progressTitle">地區完成度</h2><span>一步一步，收集日本。</span></div>
    <div id="regionProgress" class="progress-list"></div>
  </section>
  <section class="toolbar card" aria-label="景點篩選">
    <div class="toolbar-grid">
      <input id="search" type="search" aria-label="搜尋景點" placeholder="搜尋景點、都道府縣…">
      <select id="region" aria-label="篩選地區"><option value="">全部地區</option></select>
      <select id="pref" aria-label="篩選都道府縣"><option value="">全部都道府縣</option></select>
      <button id="onlyVisited" class="ghost" type="button" aria-pressed="false">只看已踩</button>
    </div>
  </section>
  <div class="list-tools"><span id="visibleCount" role="status">正在載入景點…</span><div><button id="expandAll" class="text-button" type="button">全部展開</button><button id="collapseAll" class="text-button" type="button">全部收合</button></div></div>
  <p id="saveStatus" class="save-status" role="status" aria-live="polite">勾選自動儲存在此瀏覽器。</p>
  <div id="cards" class="regions"></div>
  <p id="empty" class="empty" hidden>找不到符合條件的景點。</p>
  <details class="backup-panel card">
    <summary>紀錄備份與圖片說明</summary>
    <p>紀錄保存在這台裝置的這個瀏覽器，不會同步到 GitHub。換裝置或清除瀏覽資料前，請先匯出備份。</p>
    <div class="action-buttons"><button id="exportBtn" type="button">匯出備份</button><label class="button-label" for="importFile">匯入備份</label><input id="importFile" type="file" accept=".json,application/json"></div>
    <p>北海道 45 個項目使用預先挑選並儲存在本網站的固定照片，瀏覽時不搜尋圖片。點照片上的署名可查看作者、來源與授權；照片以 4:3 裁切顯示，沿用各自原授權。其他地區尚未完成固定配圖，暫保留原本的圖片查找方式。</p>
  </details>
  <noscript>請開啟瀏覽器的 JavaScript，才能載入景點與儲存勾選。</noscript>
</main>
<footer>700 景點 · 47 都道府縣 · 分區收藏版 · <a href="photo-credits.html">北海道圖片來源與授權</a></footer>
</body>
</html>
