name: Validate Tohoku fixed photographs
on:
  push:
    branches: [work/tohoku-static-photos]
    paths: ['tools/finalize_tohoku.py', 'tools/test_tohoku_photos.py', '.github/workflows/validate-tohoku-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tohoku-photo-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==12.0.0
          if ! command -v google-chrome && ! command -v chromium; then
            python3 -m playwright install chromium
          fi
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Integrate fixed images and attribution
        run: python3 tools/finalize_tohoku.py
      - name: Test real images and persistent browser records
        run: |
          node --check japan-checklist/photos.js
          node --check japan-checklist/app.js
          python3 tools/test_tohoku_photos.py
      - name: Commit verified website to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add japan-checklist/photos.js japan-checklist/index.html japan-checklist/photo-credits-tohoku.html
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate and verify 78 fixed Tohoku photographs with attribution'
            git push origin HEAD:work/tohoku-static-photos
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tohoku-final-review
          path: |
            japan-checklist/
            tohoku-tests/
            tools/
          retention-days: 3
