name: Validate all 700 fixed photographs
on:
  push:
    branches: [work/west-final-static-photos]
    paths: ['tools/west/photos-static.js', 'tools/west/integrate.py', 'tools/west/test_static.py', '.github/workflows/validate-west-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: west-photo-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==12.0.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          if ! command -v google-chrome && ! command -v chromium; then
            python3 -m playwright install chromium
          fi
      - name: Integrate fixed photos and attribution
        run: python3 tools/west/integrate.py
      - name: Verify images and browser records
        run: |
          node --check japan-checklist/photos.js
          node --check japan-checklist/app.js
          python3 tools/west/test_static.py
          git diff --exit-code b4715be30fff7708b69dc45c22945844ea761a4a -- japan-checklist/app.js japan-checklist/style.css japan-checklist/data.1.txt japan-checklist/data.2.txt japan-checklist/data.3.txt japan-checklist/data.4.txt japan-checklist/images/hokkaido japan-checklist/images/tohoku japan-checklist/images/kanto japan-checklist/images/hokuriku japan-checklist/images/tokai
      - name: Commit verified website to review branch only
        if: github.ref == 'refs/heads/work/west-final-static-photos'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add japan-checklist/
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate all 700 fixed photographs with attribution and verified browser preservation'
            git push origin HEAD:work/west-final-static-photos
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: west-final-review
          path: |
            japan-checklist/
            west-tests/
          retention-days: 3
