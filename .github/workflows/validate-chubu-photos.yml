name: Validate Hokuriku and Tokai fixed photographs
on:
  push:
    branches: [work/hokuriku-tokai-static-photos]
    paths:
      - 'tools/integrate_chubu.py'
      - 'tools/test_chubu_photos.py'
      - '.github/workflows/validate-chubu-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chubu-photo-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==12.0.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          if ! command -v google-chrome && ! command -v chromium; then
            python3 -m playwright install chromium
          fi
      - name: Integrate fixed photos and attribution
        run: python3 tools/integrate_chubu.py
      - name: Verify images and persistent browser records
        run: |
          node --check japan-checklist/photos.js
          node --check japan-checklist/app.js
          python3 tools/test_chubu_photos.py
      - name: Commit verified website to review branch only
        if: github.ref == 'refs/heads/work/hokuriku-tokai-static-photos'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add japan-checklist/photos.js japan-checklist/index.html japan-checklist/photo-credits-hokuriku.html japan-checklist/photo-credits-tokai.html
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate and verify 133 fixed Hokuriku and Tokai photographs and attribution'
            git push origin HEAD:work/hokuriku-tokai-static-photos
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chubu-final-review
          path: |
            japan-checklist/
            chubu-tests/
          retention-days: 3
